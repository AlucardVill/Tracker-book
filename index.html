<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tracker de Lectura</title>
    <style>
        /* Variables de color para mantener el diseño consistente */
        :root {
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --success: #059669;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            line-height: 1.5;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 25px 0;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Sistema de pestañas */
        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 15px;
            scrollbar-width: none; /* Firefox */
        }
        .tabs-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari/Edge */
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }
        .tab-btn-new {
            background: #e2e8f0;
            border: none;
            color: var(--text-main);
        }

        /* Tarjetas */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            position: relative;
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        /* Formularios */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        input:focus {
            border-color: var(--primary);
            background: white;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
        }

        /* Elementos de lectura */
        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .delete-btn:hover {
            opacity: 1;
        }

        .book-title {
            font-size: 20px;
            margin-bottom: 15px;
            padding-right: 30px;
        }

        /* Barra de progreso */
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .progress-track {
            background: var(--border-color);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--primary);
            height: 100%;
            transition: width 0.4s ease;
        }

        /* Estadísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .stat-item.full {
            grid-column: 1 / -1;
        }
        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .stat-value.highlight { color: var(--primary); }
        .stat-value.success { color: var(--success); }

        /* Actualizar página */
        .update-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .update-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }
        .update-section input {
            width: 80px;
            padding: 8px;
            text-align: center;
        }
        .btn-update {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <header>
            <h1>📚 Mis Lecturas</h1>
            <p>Calcula tu ritmo y organiza tus textos</p>
        </header>

        <!-- Pestañas (Categorías) -->
        <div class="tabs-container" id="tabsContainer">
            <!-- Generado con JS -->
        </div>

        <!-- Formulario -->
        <div class="card">
            <h2 class="card-title">Agregar nuevo texto</h2>
            <form id="bookForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Título del libro/texto</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Total Páginas</label>
                        <input type="number" id="totalPages" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Minutos x página</label>
                        <input type="number" id="minsPerPage" required min="0.1" step="0.1" placeholder="Ej: 1.5">
                    </div>
                    <div class="form-group">
                        <label>Tiempo diario (min)</label>
                        <input type="number" id="dailyMins" required min="1" placeholder="Ej: 15">
                    </div>
                    <div class="form-group">
                        <label>Página actual</label>
                        <input type="number" id="currentPage" required min="0" value="0">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar Libro</button>
            </form>
        </div>

        <!-- Lista de Libros -->
        <div id="booksList">
            <!-- Generado con JS -->
        </div>
    </div>

    <script>
        // --- ESTADO DE LA APLICACIÓN ---
        let appData = {
            categories: ['Lecturas Actuales', 'Por Leer'],
            activeCategory: 'Lecturas Actuales',
            books: []
        };

        const savedData = localStorage.getItem('readingTrackerData');
        if (savedData) {
            appData = JSON.parse(savedData);
        }

        // --- FUNCIONES DE CÁLCULO ---
        function formatTime(minutes) {
            const h = Math.floor(minutes / 60);
            const m = Math.round(minutes % 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m} min`;
        }

        function calculateStats(book) {
            const totalMins = book.totalPages * book.minsPerPage;
            const remainingPages = book.totalPages - book.currentPage;
            const remainingMins = remainingPages * book.minsPerPage;
            
            const daysRemaining = Math.ceil(remainingMins / book.dailyMins);
            const percent = Math.min(((book.currentPage / book.totalPages) * 100), 100).toFixed(1);

            const finishDate = new Date();
            finishDate.setDate(finishDate.getDate() + daysRemaining);
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = finishDate.toLocaleDateString('es-ES', dateOptions);

            return { totalMins, remainingMins, daysRemaining, percent, dateStr };
        }

        function saveData() {
            localStorage.setItem('readingTrackerData', JSON.stringify(appData));
        }

        // --- RENDERIZADO ---
        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            appData.categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === appData.activeCategory;
                btn.className = isActive ? 'tab-btn active' : 'tab-btn';
                btn.innerText = cat;
                btn.onclick = () => {
                    appData.activeCategory = cat;
                    saveData();
                    renderTabs();
                    renderBooks();
                };
                tabsContainer.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'tab-btn tab-btn-new';
            addBtn.innerText = '➕ Nueva Lista';
            addBtn.onclick = () => {
                const newCat = prompt('Nombre de la nueva lista:');
                if (newCat && !appData.categories.includes(newCat)) {
                    appData.categories.push(newCat);
                    appData.activeCategory = newCat;
                    saveData();
                    renderTabs();
                    renderBooks();
                }
            };
            tabsContainer.appendChild(addBtn);
        }

        function renderBooks() {
            const booksList = document.getElementById('booksList');
            booksList.innerHTML = '';

            const filteredBooks = appData.books.filter(b => b.category === appData.activeCategory);

            if (filteredBooks.length === 0) {
                booksList.innerHTML = '<div class="empty-state">No hay textos en esta lista aún.</div>';
                return;
            }

            filteredBooks.slice().reverse().forEach(book => {
                const stats = calculateStats(book);
                
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <button onclick="deleteBook(${book.id})" class="delete-btn" title="Eliminar">🗑️</button>
                    <h3 class="book-title">${book.title}</h3>
                    
                    <div>
                        <div class="progress-header">
                            <span>Progreso: ${stats.percent}%</span>
                            <span>Pág ${book.currentPage} de ${book.totalPages}</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${stats.percent}%"></div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Total lectura</span>
                            <span class="stat-value">${formatTime(stats.totalMins)}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Faltan</span>
                            <span class="stat-value highlight">${stats.daysRemaining} días</span>
                        </div>
                        <div class="stat-item full">
                            <span class="stat-label">Fecha proyectada</span>
                            <span class="stat-value success">📅 ${book.currentPage >= book.totalPages ? '¡Terminado!' : stats.dateStr}</span>
                        </div>
                    </div>

                    <div class="update-section">
                        <span class="update-label">Voy en la pág:</span>
                        <input type="number" id="update-page-${book.id}" value="${book.currentPage}">
                        <button onclick="updatePage(${book.id})" class="btn-update">Actualizar</button>
                    </div>
                `;
                booksList.appendChild(card);
            });
        }

        // --- ACCIONES ---
        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newBook = {
                id: Date.now(),
                title: document.getElementById('title').value,
                category: appData.activeCategory,
                totalPages: parseInt(document.getElementById('totalPages').value),
                minsPerPage: parseFloat(document.getElementById('minsPerPage').value),
                dailyMins: parseInt(document.getElementById('dailyMins').value),
                currentPage: parseInt(document.getElementById('currentPage').value)
            };

            appData.books.push(newBook);
            saveData();
            renderBooks();
            this.reset();
            document.getElementById('currentPage').value = 0;
        });

        function updatePage(id) {
            const newPage = parseInt(document.getElementById(`update-page-${id}`).value);
            const book = appData.books.find(b => b.id === id);
            if (book) {
                book.currentPage = Math.max(0, Math.min(newPage, book.totalPages));
                saveData();
                renderBooks();
            }
        }

        function deleteBook(id) {
            if(confirm('¿Estás seguro de eliminar este texto?')) {
                appData.books = appData.books.filter(b => b.id !== id);
                saveData();
                renderBooks();
            }
        }

        renderTabs();
        renderBooks();
    </script>
</body>
</html>
