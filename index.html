<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tracker de Lectura</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --success: #059669;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); padding-bottom: 60px; line-height: 1.5;
        }

        .container { max-width: 550px; margin: 0 auto; padding: 20px; }

        header { text-align: center; padding: 25px 0 15px 0; }
        h1 { color: var(--primary); font-size: 26px; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }

        .btn-schedule {
            background: var(--text-main); color: white; border: none; padding: 12px 20px; border-radius: 8px;
            font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; display: flex;
            align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; margin-bottom: 20px;
        }
        .btn-schedule:hover { background: #0f172a; }

        .tabs-container {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2); }
        .tab-btn-new { background: #e2e8f0; border: none; color: var(--text-main); }
        .tab-delete {
            background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 50%;
            width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px; cursor: pointer;
        }
        .tab-delete:hover { background: rgba(255,0,0,0.5); }

        .card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); position: relative;
        }
        .card.inactive { opacity: 0.7; }
        
        .card-header-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            padding-bottom: 15px; border-bottom: 1px solid var(--border-color);
        }
        .status-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .status-toggle input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }
        .priority-control { display: flex; align-items: center; gap: 8px; }
        .priority-control label { font-size: 10px; margin: 0; }
        .priority-control input[type="range"] { width: 80px; accent-color: var(--primary); cursor: pointer; }

        .card-title {
            font-size: 18px; margin-bottom: 15px; color: var(--primary); padding-right: 60px;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: color 0.2s;
        }
        .card-title:hover { color: var(--primary-hover); text-decoration: underline; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group.full { grid-column: 1 / -1; }

        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
        input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color 0.2s; background: #fafafa; font-family: inherit;
        }
        input:focus, textarea:focus { border-color: var(--primary); background: white; }

        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
        .btn-cancel { background: var(--text-muted); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }

        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 12px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; opacity: 0.5; transition: opacity 0.2s, transform 0.2s; }
        .icon-btn:hover { opacity: 1; transform: scale(1.1); }

        .edit-section { background: #f8fafc; border: 1px dashed var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        
        .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .progress-track { background: var(--border-color); border-radius: 10px; height: 10px; width: 100%; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; transition: width 0.4s ease; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .stat-item.full { grid-column: 1 / -1; }
        .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .stat-value.highlight { color: var(--primary); }
        .stat-value.success { color: var(--success); }

        .update-section { display: flex; align-items: center; gap: 10px; }
        .update-label { font-size: 14px; font-weight: 500; color: var(--text-main); }
        .update-section input { width: 80px; padding: 8px; text-align: center; }
        .btn-update { background: var(--text-main); color: white; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 15px; }

        /* Modales */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: white; border-radius: 12px; width: 100%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; padding: 25px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: var(--border-color); border: none;
            width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        
        .checklist-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .checklist-item input[type="checkbox"] { margin-top: 4px; width: 18px; height: 18px; cursor: pointer; }
        .checklist-text { flex: 1; font-size: 14px; word-break: break-word; }
        .checklist-text.done { text-decoration: line-through; color: var(--text-muted); }

        .schedule-item {
            padding: 12px; border-left: 4px solid var(--primary); background: #f8fafc;
            margin-bottom: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 4px;
        }
        .schedule-time { font-weight: 800; color: var(--primary); font-size: 15px; }
        .schedule-title { font-weight: 600; color: var(--text-main); font-size: 16px; }
        .schedule-meta { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 Mis Lecturas</h1>
            <p>Calcula tu ritmo y organiza tus textos</p>
        </header>

        <button onclick="generateSchedule()" class="btn-schedule">📅 Generar Horario de Hoy</button>

        <div class="tabs-container" id="tabsContainer"></div>

        <div class="card">
            <h2 class="card-title" style="color: var(--text-main); cursor: default; pointer-events: none;">Agregar nuevo texto</h2>
            <form id="bookForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Título del libro/texto</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Total Páginas</label>
                        <input type="number" id="totalPages" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Minutos x página</label>
                        <input type="number" id="minsPerPage" required min="0.1" step="0.1" placeholder="Ej: 1.5">
                    </div>
                    <div class="form-group">
                        <label>Tiempo diario (min)</label>
                        <input type="number" id="dailyMins" required min="1" placeholder="Ej: 15">
                    </div>
                    <div class="form-group">
                        <label>Página actual</label>
                        <input type="number" id="currentPage" required min="0" value="0">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar Libro</button>
            </form>
        </div>

        <div id="booksList"></div>
    </div>

    <!-- Modal Notas y Checklist -->
    <div id="bookModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('bookModal')">&times;</button>
            <h2 id="modalTitle" class="card-title" style="margin-bottom: 5px; color: var(--text-main); cursor: default;"></h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Espacio de trabajo</p>
            
            <label>Notas Libres (Se guardan al cerrar)</label>
            <textarea id="modalNotes" rows="6" placeholder="Escribe tus apuntes, resúmenes o ideas aquí..."></textarea>
            
            <label style="margin-top: 20px;">Checklist / Tareas</label>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="newChecklistInput" placeholder="Ej: Leer capítulo 1...">
                <button onclick="addChecklist()" class="btn-update">Añadir</button>
            </div>
            <div id="modalChecklist"></div>
        </div>
    </div>

    <!-- Modal Generador de Horario -->
    <div id="scheduleModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('scheduleModal')">&times;</button>
            <h2 style="font-size: 20px; color: var(--text-main); margin-bottom: 5px;">Tu Horario de Lectura</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Generado para los textos activos según su prioridad.</p>
            <div id="scheduleContent"></div>
        </div>
    </div>

    <script>
        let appData = {
            categories: ['Lecturas Actuales', 'Por Leer'],
            activeCategory: 'Lecturas Actuales',
            books: []
        };

        const savedData = localStorage.getItem('readingTrackerData');
        if (savedData) {
            appData = JSON.parse(savedData);
            // Actualización de compatibilidad para datos viejos
            appData.books.forEach(b => {
                if(!b.notes) b.notes = "";
                if(!b.checklists) b.checklists = [];
                if(b.active === undefined) b.active = true;
                if(b.priority === undefined) b.priority = 50;
            });
        }

        let currentModalBookId = null;

        function formatTime(minutes) {
            const h = Math.floor(minutes / 60);
            const m = Math.round(minutes % 60);
            if (h > 0 && m > 0) return `${h}h ${m}m`;
            if (h > 0) return `${h}h`;
            return `${m} min`;
        }

        function calculateStats(book) {
            const totalMins = book.totalPages * book.minsPerPage;
            const readMins = book.currentPage * book.minsPerPage;
            const remainingPages = book.totalPages - book.currentPage;
            const remainingMins = remainingPages * book.minsPerPage;
            const daysRemaining = Math.ceil(remainingMins / book.dailyMins);
            const percent = Math.min(((book.currentPage / book.totalPages) * 100), 100).toFixed(1);
            const finishDate = new Date();
            finishDate.setDate(finishDate.getDate() + daysRemaining);
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = finishDate.toLocaleDateString('es-ES', dateOptions);
            return { totalMins, readMins, remainingMins, daysRemaining, percent, dateStr };
        }

        function saveData() { localStorage.setItem('readingTrackerData', JSON.stringify(appData)); }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            appData.categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === appData.activeCategory;
                btn.className = isActive ? 'tab-btn active' : 'tab-btn';
                if(isActive) {
                    btn.innerHTML = `${cat} <span class="tab-delete" onclick="deleteCategory('${cat}', event)" title="Eliminar lista">&times;</span>`;
                } else {
                    btn.innerText = cat;
                }
                btn.onclick = (e) => {
                    if(e.target.classList.contains('tab-delete')) return;
                    appData.activeCategory = cat;
                    saveData();
                    renderTabs();
                    renderBooks();
                };
                tabsContainer.appendChild(btn);
            });
            const addBtn = document.createElement('button');
            addBtn.className = 'tab-btn tab-btn-new';
            addBtn.innerText = '➕ Nueva Lista';
            addBtn.onclick = () => {
                const newCat = prompt('Nombre de la nueva lista:');
                if (newCat && !appData.categories.includes(newCat)) {
                    appData.categories.push(newCat);
                    appData.activeCategory = newCat;
                    saveData(); renderTabs(); renderBooks();
                }
            };
            tabsContainer.appendChild(addBtn);
        }

        function deleteCategory(cat, event) {
            event.stopPropagation();
            if (appData.categories.length === 1) { alert("No puedes eliminar la única lista que te queda."); return; }
            if (confirm(`¿Estás seguro de eliminar "${cat}" y TODOS los textos que contiene?`)) {
                appData.categories = appData.categories.filter(c => c !== cat);
                appData.books = appData.books.filter(b => b.category !== cat);
                appData.activeCategory = appData.categories[0];
                saveData(); renderTabs(); renderBooks();
            }
        }

        function renderBooks() {
            const booksList = document.getElementById('booksList');
            booksList.innerHTML = '';
            const filteredBooks = appData.books.filter(b => b.category === appData.activeCategory);

            if (filteredBooks.length === 0) {
                booksList.innerHTML = '<div class="empty-state">No hay textos en esta lista aún.</div>'; return;
            }

            // Ordenar visualmente: Activos primero, Inactivos después
            const sortedBooks = filteredBooks.slice().sort((a, b) => {
                if(a.active === b.active) return b.id - a.id; // más recientes arriba
                return a.active ? -1 : 1;
            });

            sortedBooks.forEach(book => {
                const stats = calculateStats(book);
                const card = document.createElement('div');
                card.className = `card ${!book.active ? 'inactive' : ''}`;

                card.innerHTML = `
                    <div class="card-header-controls">
                        <label class="status-toggle">
                            <input type="checkbox" ${book.active ? 'checked' : ''} onchange="toggleActive(${book.id})">
                            ${book.active ? 'Activa' : 'Inactiva'}
                        </label>
                        <div class="priority-control">
                            <label>Prioridad: <span id="val-pri-${book.id}">${book.priority}%</span></label>
                            <input type="range" min="0" max="100" value="${book.priority}" 
                                oninput="document.getElementById('val-pri-${book.id}').innerText = this.value + '%'"
                                onchange="updatePriority(${book.id}, this.value)">
                        </div>
                    </div>

                    <div class="card-actions">
                        <button onclick="toggleEdit(${book.id})" class="icon-btn" title="Editar">✏️</button>
                        <button onclick="deleteBook(${book.id})" class="icon-btn" title="Eliminar">🗑️</button>
                    </div>
                    
                    <h3 class="card-title" onclick="openNotesModal(${book.id})" title="Toca para abrir notas y checklist">
                        ${book.title} <span style="font-size: 14px;">📝</span>
                    </h3>
                    
                    <div id="edit-section-${book.id}" class="edit-section" style="display: none;">
                        <div class="form-grid">
                            <div class="form-group full">
                                <label>Título</label>
                                <input type="text" id="edit-title-${book.id}" value="${book.title}" required>
                            </div>
                            <div class="form-group">
                                <label>Total Páginas</label>
                                <input type="number" id="edit-total-${book.id}" value="${book.totalPages}" required min="1">
                            </div>
                            <div class="form-group">
                                <label>Minutos x pág</label>
                                <input type="number" id="edit-mins-${book.id}" value="${book.minsPerPage}" required min="0.1" step="0.1">
                            </div>
                            <div class="form-group">
                                <label>Tiempo diario (min)</label>
                                <input type="number" id="edit-daily-${book.id}" value="${book.dailyMins}" required min="1">
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="saveEdit(${book.id})" class="btn-submit">Guardar</button>
                            <button onclick="toggleEdit(${book.id})" class="btn-cancel">Cancelar</button>
                        </div>
                    </div>

                    <div id="view-section-${book.id}">
                        <div>
                            <div class="progress-header">
                                <span>Progreso: ${stats.percent}%</span>
                                <span>Pág ${book.currentPage} de ${book.totalPages}</span>
                            </div>
                            <div class="progress-track"><div class="progress-fill" style="width: ${stats.percent}%"></div></div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item"><span class="stat-label">Tiempo Leído</span><span class="stat-value">${formatTime(stats.readMins)}</span></div>
                            <div class="stat-item"><span class="stat-label">Tiempo Restante</span><span class="stat-value">${formatTime(stats.remainingMins)}</span></div>
                            <div class="stat-item"><span class="stat-label">Total del Libro</span><span class="stat-value">${formatTime(stats.totalMins)}</span></div>
                            <div class="stat-item"><span class="stat-label">Días Restantes</span><span class="stat-value highlight">${stats.daysRemaining} días</span></div>
                            <div class="stat-item full"><span class="stat-label">Fecha Proyectada</span><span class="stat-value success">📅 ${book.currentPage >= book.totalPages ? '¡Terminado!' : stats.dateStr}</span></div>
                        </div>
                        <div class="update-section">
                            <span class="update-label">Voy en la pág:</span>
                            <input type="number" id="update-page-${book.id}" value="${book.currentPage}">
                            <button onclick="updatePage(${book.id})" class="btn-update">Actualizar</button>
                        </div>
                    </div>
                `;
                booksList.appendChild(card);
            });
        }

        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            appData.books.push({
                id: Date.now(),
                title: document.getElementById('title').value,
                category: appData.activeCategory,
                totalPages: parseInt(document.getElementById('totalPages').value),
                minsPerPage: parseFloat(document.getElementById('minsPerPage').value),
                dailyMins: parseInt(document.getElementById('dailyMins').value),
                currentPage: parseInt(document.getElementById('currentPage').value),
                notes: "", checklists: [], active: true, priority: 50
            });
            saveData(); renderBooks(); this.reset(); document.getElementById('currentPage').value = 0;
        });

        function updatePage(id) {
            const newPage = parseInt(document.getElementById(`update-page-${id}`).value);
            const book = appData.books.find(b => b.id === id);
            if (book) { book.currentPage = Math.max(0, Math.min(newPage, book.totalPages)); saveData(); renderBooks(); }
        }

        function deleteBook(id) {
            if(confirm('¿Eliminar este texto?')) { appData.books = appData.books.filter(b => b.id !== id); saveData(); renderBooks(); }
        }

        function toggleEdit(id) {
            const editSection = document.getElementById(`edit-section-${id}`);
            const viewSection = document.getElementById(`view-section-${id}`);
            if (editSection.style.display === 'none') { editSection.style.display = 'block'; viewSection.style.display = 'none'; } 
            else { editSection.style.display = 'none'; viewSection.style.display = 'block'; }
        }

        function saveEdit(id) {
            const book = appData.books.find(b => b.id === id);
            if(book) {
                book.title = document.getElementById(`edit-title-${id}`).value;
                book.totalPages = parseInt(document.getElementById(`edit-total-${id}`).value);
                book.minsPerPage = parseFloat(document.getElementById(`edit-mins-${id}`).value);
                book.dailyMins = parseInt(document.getElementById(`edit-daily-${id}`).value);
                if (book.currentPage > book.totalPages) book.currentPage = book.totalPages;
                saveData(); renderBooks();
            }
        }

        // Toggles y Prioridad
        function toggleActive(id) {
            const book = appData.books.find(b => b.id === id);
            if(book) { book.active = !book.active; saveData(); renderBooks(); }
        }
        function updatePriority(id, value) {
            const book = appData.books.find(b => b.id === id);
            if(book) { book.priority = parseInt(value); saveData(); }
        }

        // Generador de Horario
        function generateSchedule() {
            // Filtrar y ordenar TODAS las lecturas activas (sin importar la pestaña actual)
            const activeBooks = appData.books.filter(b => b.active === true && b.currentPage < b.totalPages);
            
            if(activeBooks.length === 0) {
                alert("No tienes lecturas activas o incompletas para programar.");
                return;
            }

            activeBooks.sort((a, b) => b.priority - a.priority);

            let currentTime = new Date();
            const formatTimeOpts = { hour: '2-digit', minute: '2-digit', hour12: false };
            let scheduleHTML = '';

            activeBooks.forEach(book => {
                const startTime = currentTime.toLocaleTimeString([], formatTimeOpts);
                currentTime.setMinutes(currentTime.getMinutes() + book.dailyMins);
                const endTime = currentTime.toLocaleTimeString([], formatTimeOpts);

                scheduleHTML += `
                    <div class="schedule-item">
                        <span class="schedule-time">${startTime} - ${endTime}</span>
                        <span class="schedule-title">${book.title}</span>
                        <span class="schedule-meta">Prioridad: ${book.priority}% | Duración: ${book.dailyMins} min | En la lista: ${book.category}</span>
                    </div>
                `;
            });

            document.getElementById('scheduleContent').innerHTML = scheduleHTML;
            document.getElementById('scheduleModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // Funciones del Modal General
        function closeModal(modalId) {
            if(modalId === 'bookModal' && currentModalBookId) {
                const book = appData.books.find(b => b.id === currentModalBookId);
                if(book) { book.notes = document.getElementById('modalNotes').value; saveData(); }
                currentModalBookId = null;
            }
            document.getElementById(modalId).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Modal Notas
        function openNotesModal(id) {
            currentModalBookId = id;
            const book = appData.books.find(b => b.id === id);
            if(!book) return;
            document.getElementById('modalTitle').innerText = book.title;
            document.getElementById('modalNotes').value = book.notes || "";
            renderChecklists();
            document.getElementById('bookModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function renderChecklists() {
            const book = appData.books.find(b => b.id === currentModalBookId);
            const container = document.getElementById('modalChecklist');
            container.innerHTML = '';
            book.checklists.forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'checklist-item';
                div.innerHTML = `<input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${index})">
                    <span class="checklist-text ${item.done ? 'done' : ''}">${item.text}</span>
                    <button onclick="deleteCheck(${index})" class="icon-btn" style="color: var(--danger); font-size: 16px;">&times;</button>`;
                container.appendChild(div);
            });
        }

        function addChecklist() {
            const input = document.getElementById('newChecklistInput');
            const text = input.value.trim();
            if(text && currentModalBookId) {
                const book = appData.books.find(b => b.id === currentModalBookId);
                book.checklists.push({ text, done: false });
                saveData(); input.value = ''; renderChecklists();
            }
        }

        function toggleCheck(index) {
            const book = appData.books.find(b => b.id === currentModalBookId);
            book.checklists[index].done = !book.checklists[index].done;
            saveData(); renderChecklists();
        }
        function deleteCheck(index) {
            const book = appData.books.find(b => b.id === currentModalBookId);
            book.checklists.splice(index, 1); saveData(); renderChecklists();
        }
        document.getElementById('newChecklistInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); addChecklist(); }
        });

        renderTabs(); renderBooks();
    </script>
</body>
</html>
